name: CI
on:
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "3"
  UVX_CONSTRAINT: requirements/lock/uvx-tools.txt
  UVX_COMMAND: uvx -crequirements/lock/uvx-tools.txt
  NOX_COMMAND: uv run --script noxfile.py
  EXTRA_PYTHON_VERSIONS: "pypy-3.11"

permissions: {}

jobs:
  pre_job:
    uses: $/.github/workflows/skip_duplicate_actions.yml

  build-package:
    name: Build & verify package
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hynek/build-and-inspect-python-package@2abe76da66d0a6a4a227101f9348ee855797cfa5 # v3.0.1
        id: baipp

      - name: Set python version parameters
        id: versions
        shell: python
        env:
          python_classifiers: ${{ steps.baipp.outputs.supported_python_classifiers_json_array }}
        run: |
          import os
          import json
          from pathlib import Path

          default_python_version = Path(".python-version").read_text().strip()
          python_versions = json.loads(os.getenv("python_classifiers"))
          extra_python_versions = [_.strip() for _ in os.getenv("EXTRA_PYTHON_VERSIONS", "").split(",") if _]

          min_python_version = python_versions[0]
          max_python_version = python_versions[-1]
          minmax_python_versions = [min_python_version, max_python_version, *extra_python_versions]
          minmax_default_python_versions = list({*minmax_python_versions, default_python_version})
          all_python_versions = list({*python_versions, *extra_python_versions})

          print("{default_python_version=:s}")
          print("{min_python_version=:s}")
          print("{max_python_version=:s}")
          print("{minmax_python_versions=}")
          print("{minmax_default_python_versions=}")
          print("{all_python_version=}")

          with open(os.getenv("GITHUB_OUTPUT"), "a") as f:
            f.write(f"{default_python_version=:s}\n")
            f.write(f"{min_python_version=:s}\n")
            f.write(f"{max_python_version=:s}\n")
            f.write(f"minmax_python_versions={json.dumps(minmax_python_versions)}\n")
            f.write(f"minmax_default_python_versions={json.dumps(minmax_default_python_versions)}\n")
            f.write(f"all_python_versions={json.dumps(all_python_versions)}\n")

    outputs:
      default-python-version: ${{ steps.versions.outputs.default_python_version }}
      min-python-version: ${{ steps.versions.outputs.min_python_version }}
      max-python-version: ${{ steps.versions.outputs.max_python_version }}
      minmax-python-versions: ${{ steps.versions.outputs.minmax_python_versions }}
      minmax-default-python-versions: ${{ steps.versions.outputs.minmax_default_python_versions }}
      all-python-version: ${{ steps.versions.outputs.all_python_versions }}

  pinact:
    name: Pin actions
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # required for action
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pin actions
        uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        with:
          skip_push: "true"

  zizmor:
    name: Run zizmor 🌈
    runs-on: ubuntu-latest
    permissions:
      security-events: write # Required for upload-sarif (used by zizmor-action) to upload SARIF files.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor 🌈
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          persona: pedantic

  typecheck:
    name: Typecheck package
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          # - windows-latest
        session:
          - typecheck
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-cached-uv-and-python
        with:
          python-version-file: ".python-version"
          cache-dependency-path: uv.lock
      - name: Get python version
        id: python_version
        run: |
          python_version=$(cat .python-version)
          echo "python_version=${python_version}" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: typecheck
        env:
          python_version: ${{ steps.python_version.outputs.python_version }}
          session: ${{ matrix.session }}
        run: $NOX_COMMAND -s "${session}-${python_version}"
        shell: bash

  test:
    name: Test package across pythons
    needs:
      - pre_job
      - build-package
    if: needs.pre_job.outputs.should_skip != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        python-version: ${{ fromJson(needs.build-package.outputs.minmax-default-python-versions) }}
        session:
          - test
        include:
          - os: windows-latest
            python-version: ${{ needs.build-package.outputs.default-python-version }}
            session: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Packages
          path: dist
      - uses: $/.github/actions/setup-cached-uv-and-python
        with:
          python-version: ${{ matrix.python-version }}
          cache-dependency-path: uv.lock

      - name: Test with nox
        env:
          python_version: ${{ matrix.python-version }}
          options: "++installpkg dist/*.whl"
          session: ${{ matrix.session }}
        run: |
          # shellcheck disable=SC2086
          $NOX_COMMAND -s "${session}-${python_version}" -- $options
        shell: bash -euxo pipefail {0}

      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.session }}
          path: .nox/test-*/tmp/.coverage*
          include-hidden-files: true
          if-no-files-found: ignore

  coverage:
    name: Combine coverage
    needs:
      - pre_job
      - test
    if: needs.pre_job.outputs.should_skip != 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download individual coverage reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-data-*
          path: .nox
          merge-multiple: true
      - name: Display structure of downloaded files
        run: ls -aR

      - uses: $/.github/actions/setup-cached-uv-and-python
        with:
          python-version-file: ".python-version"
          cache-dependency-path: requirements/lock/uvx-tools.txt
      - name: Run coverage
        run: |
          $NOX_COMMAND -s coverage -- ++coverage combine html markdown
          cat coverage.md
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"

          # fail if under 100%
          $NOX_COMMAND -s coverage -- ++coverage report ++coverage-options --fail-under=100
        shell: bash
      - name: Upload HTML report if check failed.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: html-report
          path: htmlcov
        if: ${{ failure() }}

  docs:
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    permissions:
      contents: write # required for action
    uses: $/.github/workflows/docs.yml
    with:
      deploy: false

  # Ensure everything required is passing for branch protection.
  required-checks-pass:
    name: required-checks-pass
    if: always()
    needs:
      - pre_job
      - pinact
      - typecheck
      - test
      - coverage
      - docs
      - zizmor
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: "pinact,typecheck,test,coverage,docs,zizmor"
          jobs: ${{ toJSON(needs) }}
