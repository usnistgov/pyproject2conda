[formatting]
array_auto_collapse = false
column_width = 120
compact_arrays = false
indent_string = "    "
reorder_arrays = true
reorder_keys = true

# NOTE(wpk): removed taplo from formatting pyproject.toml in `.pre-commit-config`.
# Keep this here incase want to run taplo separately from time to time.
[[rule]]
include = [ "**/pyproject.toml" ]
keys = [ "project", "tool.coverage", "tool.mypy.overrides" ]

[rule.formatting]
reorder_arrays = false

[[rule]]
include = [ "**/pyproject.toml" ]
keys = [
    "build-system",
    "dependency-groups",
    "project",
    "tool.coverage",
    "tool.mypy",
    "tool.pyproject-fmt",
    "tool.pyproject2conda",
    "tool.pyrefly",
    "tool.pyright",
    "tool.ruff",
    "tool.ty",
    "tool.uv",
    "tool.uv-locker.requirements",
]

[rule.formatting]
reorder_keys = false

[[rule]]
include = [ "tests/data/*.toml" ]
keys = [ "dependency-groups", "project", "tool.pyproject2conda" ]

[rule.formatting]
reorder_arrays = false
reorder_keys = false
